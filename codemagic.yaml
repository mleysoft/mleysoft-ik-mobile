workflows:
  ios-testflight:
    name: MleySoft IK iOS TestFlight V203
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: com.mleysoft.ik
        API_BASE_URL: https://mleysoft.com/system/ik/api/v1
    scripts:
      - name: Create and configure iOS platform
        script: |
          rm -rf ios
          flutter create --platforms=ios --org com.mleysoft .
          python3 native_config/configure_ios.py
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          grep -q "com.mleysoft.ik" ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/GoogleService-Info.plist
          grep -q "GoogleService-Info.plist in Resources" ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Runner.entitlements
          /usr/libexec/PlistBuddy -c "Print :aps-environment" ios/Runner/Runner.entitlements | grep -q production
          grep -q "Messaging.messaging().apnsToken = deviceToken" ios/Runner/AppDelegate.swift
          /usr/libexec/PlistBuddy -c "Print :FirebaseAppDelegateProxyEnabled" ios/Runner/Info.plist | grep -q false
          grep -q "s.dependency 'FirebaseMessaging'" packages/mleysoft_native_bridge/ios/mleysoft_native_bridge.podspec
          grep -q 'getNativePushTokens' packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
      - name: Get Flutter packages and verify native plugin registration
        script: |
          flutter pub get
          flutter build ios --config-only --release
          grep -R -q 'MleySoftNativeBridgePlugin' ios/Runner/GeneratedPluginRegistrant.*
          grep -R -q 'mleysoft_native_bridge' ios/Podfile.lock ios/Pods/Manifest.lock 2>/dev/null || true
      - name: Verify iOS foreground-only location configuration
        script: |
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          ! /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" ios/Runner/Info.plist >/dev/null 2>&1
          ! grep -q "geolocator:" pubspec.yaml
          ! grep -R -q "requestAlwaysAuthorization" ios/Runner
          test -f packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
          grep -q 'com.mleysoft.ik/location' packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
          grep -q 'com.mleysoft.ik/permissions' packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
          grep -q 'requestWhenInUseAuthorization()' packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
          grep -q 'UNUserNotificationCenter.current().requestAuthorization' packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
          ! grep -q 'requestAlwaysAuthorization' packages/mleysoft_native_bridge/ios/Classes/MleySoftNativeBridgePlugin.swift
      - name: Build IPA and verify final binary privacy
        script: |
          flutter build ipa --release --dart-define=API_BASE_URL="$API_BASE_URL"
          IPA_FILE=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA_FILE"
          rm -rf /tmp/mleysoft_ipa_verify && mkdir -p /tmp/mleysoft_ipa_verify
          unzip -q "$IPA_FILE" -d /tmp/mleysoft_ipa_verify
          FINAL_PLIST=$(find /tmp/mleysoft_ipa_verify/Payload -maxdepth 2 -name Info.plist | head -1)
          test -f /tmp/mleysoft_ipa_verify/Payload/Runner.app/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" /tmp/mleysoft_ipa_verify/Payload/Runner.app/GoogleService-Info.plist | grep -q '^com.mleysoft.ik$'
          codesign -d --entitlements :- /tmp/mleysoft_ipa_verify/Payload/Runner.app 2>/tmp/mleysoft_entitlements.plist || true
          grep -q 'aps-environment' /tmp/mleysoft_entitlements.plist || { echo "ERROR: signed IPA has no aps-environment entitlement"; cat /tmp/mleysoft_entitlements.plist; exit 1; }
          test -n "$FINAL_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$FINAL_PLIST"
          ! /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" "$FINAL_PLIST" >/dev/null 2>&1
          if find /tmp/mleysoft_ipa_verify/Payload -iname '*geolocator*' | grep -q .; then echo "ERROR: geolocator artifact found in IPA"; exit 1; fi
          if grep -R -a -q "requestAlwaysAuthorization" /tmp/mleysoft_ipa_verify/Payload; then echo "ERROR: Always Location API reference found in final IPA"; exit 1; fi
          grep -a -q "com.mleysoft.ik/location" /tmp/mleysoft_ipa_verify/Payload/Runner.app/Runner
          grep -a -q "com.mleysoft.ik/permissions" /tmp/mleysoft_ipa_verify/Payload/Runner.app/Runner
          echo "V121 VERIFY OK: final IPA contains registered native bridge channels, notification permission support and no Always Location API reference."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
